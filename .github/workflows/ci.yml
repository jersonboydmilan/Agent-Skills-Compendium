name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, validate, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate registry content
        run: npm run validate:content

      - name: Test
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  artifacts:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # schema/ is generated from src/lib/schema.ts. Regenerating it must be a
      # no-op on a clean tree, or the committed schema has drifted.
      - name: Regenerate schema
        run: npm run generate:schema

      - name: Fail if generated output drifted from the committed source
        run: |
          if ! git diff --quiet -- schema; then
            echo "::error::schema/ is out of date. Run 'npm run generate:schema' and commit the result."
            git --no-pager diff -- schema
            exit 1
          fi
